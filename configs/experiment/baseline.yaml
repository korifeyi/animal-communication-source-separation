# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /data: bats
  #- override /model: baseline_net
  - override /callbacks: default
  - override /trainer: mps

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["bats", "baseline", "efficientnet"]

seed: 245

trainer:
  min_epochs: 10
  max_epochs: 10
  gradient_clip_val: 0.5

# model:
#   optimizer:
#     lr: 0.002
#   net:
#     pretrained: true
#   compile: false

data:
  batch_size: 32
  desired_length: 1
  sample_rate: 80000
  n_fft: 1024
  hop: 256

logger:
  wandb:
    tags: ${tags}
    group: "baseline"
  # aim:
  #   experiment: "baseline"
